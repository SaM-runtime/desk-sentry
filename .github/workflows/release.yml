name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DESKSENTRY_RELEASE: "1"
      DESKSENTRY_METADATA_DIR: .tmp/release

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create project virtualenv
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m venv .venv

      - name: Cache verified models
        uses: actions/cache@v6
        with:
          path: models/*.onnx
          key: models-${{ runner.os }}-${{ hashFiles('tools/fetch_model.py') }}

      - name: Install project, test tools, and PyInstaller
        run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]" "PyInstaller==6.21.0"

      - name: Verify repository identity
        shell: pwsh
        run: |
          $expected = .\.venv\Scripts\python.exe -c "from desk_sentry.project import GITHUB_REPOSITORY; print(GITHUB_REPOSITORY)"
          if ($expected -ne $env:GITHUB_REPOSITORY) {
            throw "Workflow repository '$env:GITHUB_REPOSITORY' does not match project '$expected'."
          }
          "DESKSENTRY_REPOSITORY=$expected" >> $env:GITHUB_ENV

      - name: Verify tag matches application version
        shell: pwsh
        run: .\.venv\Scripts\python.exe packaging/build_release.py check-tag --tag "$env:GITHUB_REF_NAME"

      - name: Fetch and verify models
        run: .\.venv\Scripts\python.exe tools/fetch_model.py

      - name: Verify generated README links
        run: .\.venv\Scripts\python.exe packaging/build_release.py check-readme --path README.md

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Run Ruff
        run: .\.venv\Scripts\python.exe -m ruff check src tests tools packaging

      - name: Check formatting
        run: .\.venv\Scripts\python.exe -m ruff format --check src tests tools packaging

      - name: Run mypy
        run: .\.venv\Scripts\python.exe -m mypy src

      - name: Prepare release metadata
        run: .\.venv\Scripts\python.exe packaging/build_release.py prepare --output .tmp/release

      - name: Build application
        run: >-
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm packaging/DeskSentry.spec
          --distpath .tmp/release/dist --workpath .tmp/release/build

      - name: Build installer with Inno Setup 6
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup 6 compiler was not found on the hosted runner."
          }
          $defines = (Resolve-Path .tmp/release/installer-defines.iss).Path
          & $iscc "/DGeneratedDefines=$defines" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable archive, checksums, and release notes
        shell: pwsh
        run: |
          $version = .\.venv\Scripts\python.exe -c "from desk_sentry import __version__; print(__version__)"
          .\.venv\Scripts\python.exe packaging/build_release.py package `
            --dist .tmp/release/dist/DeskSentry `
            --installer ".tmp/release/DeskSentry-$version-Setup.exe" `
            --output .tmp/release `
            --changelog CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = .\.venv\Scripts\python.exe -c "from desk_sentry import __version__; print(__version__)"
          gh release create $env:GITHUB_REF_NAME `
            .tmp/release/DeskSentry-$version-Setup.exe `
            .tmp/release/DeskSentry-$version-portable.zip `
            .tmp/release/SHA256SUMS.txt `
            --repo $env:DESKSENTRY_REPOSITORY `
            --verify-tag `
            --draft `
            --title "Desk Sentry $version" `
            --notes-file .tmp/release/release-notes.md


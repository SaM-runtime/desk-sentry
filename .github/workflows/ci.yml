name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create project virtualenv
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m venv .venv

      - name: Cache verified models
        uses: actions/cache@v6
        with:
          path: models/*.onnx
          key: models-${{ runner.os }}-${{ hashFiles('tools/fetch_model.py') }}

      - name: Install project, test tools, and PyInstaller
        run: .\.venv\Scripts\python.exe -m pip install -e ".[dev]" "PyInstaller==6.21.0"

      - name: Export canonical repository identity
        shell: pwsh
        run: |
          $repository = .\.venv\Scripts\python.exe -c "from desk_sentry.project import GITHUB_REPOSITORY; print(GITHUB_REPOSITORY)"
          "DESKSENTRY_REPOSITORY=$repository" >> $env:GITHUB_ENV

      - name: Fetch and verify models
        run: .\.venv\Scripts\python.exe tools/fetch_model.py

      - name: Verify generated README links
        run: .\.venv\Scripts\python.exe packaging/build_release.py check-readme --path README.md

      - name: Scan publication privacy
        run: .\.venv\Scripts\python.exe tools/privacy_scan.py

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Run Ruff
        run: .\.venv\Scripts\python.exe -m ruff check src tests tools packaging

      - name: Check formatting
        run: .\.venv\Scripts\python.exe -m ruff format --check src tests tools packaging

      - name: Run mypy
        run: .\.venv\Scripts\python.exe -m mypy src


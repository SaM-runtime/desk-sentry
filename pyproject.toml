[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-sentry"
dynamic = ["version"]
description = "Local webcam rear-view mirror: warns when someone moves up behind you."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy==2.5.1",
  "opencv-python-headless==5.0.0.93",
  "PySide6-Essentials==6.11.1",
  "winrt-runtime==4.1.0",
  "winrt-Windows.Media.Capture==4!10.0.28000.2957",
  "winrt-Windows.Media.Capture.Frames==4!10.0.28000.2957",
  "winrt-Windows.Media.MediaProperties==4!10.0.28000.2957",
  "winrt-Windows.Media.Devices==4!10.0.28000.2957",
  "winrt-Windows.Graphics.Imaging==4!10.0.28000.2957",
  "winrt-Windows.Storage.Streams==4!10.0.28000.2957",
  "winrt-Windows.Foundation==4!10.0.28000.2957",
  "winrt-Windows.Foundation.Collections==4!10.0.28000.2957",
  "winrt-Windows.Devices.Enumeration==4!10.0.28000.2957",
]

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.15.21",
]

[project.gui-scripts]
desk-sentry = "desk_sentry.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "desk_sentry.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "tests"]
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["desk_sentry"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
desk_sentry = ["assets/*.png"]
